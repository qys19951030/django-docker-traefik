version: '3.8'

services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    command: bash -c 'while !</dev/tcp/db/5432; do sleep 1; done; gunicorn --bind 0.0.0.0:8000 config.wsgi'
    expose:
      - 8000
    # SECRET_KEY must be provided by the user. Never use any example/demo value
    # from the repository. Generate one with:
    #   python -c "import secrets; print(secrets.token_urlsafe(64))"
    # Pass it via shell env: SECRET_KEY=... docker compose -f docker-compose.prod.yml up
    # Or use a .env file: docker compose --env-file .env.prod -f docker-compose.prod.yml up
    environment:
      DEBUG: "0"
      SECRET_KEY: "${SECRET_KEY:?ERROR SECRET_KEY environment variable is required for production. Generate your own with python -c import secrets; print secrets.token_urlsafe 64. See README for details.}"
      DATABASE_URL: "postgresql://django_traefik:django_traefik@db:5432/django_traefik"
      DJANGO_ALLOWED_HOSTS: "django-traefik.your-domain.com,.your-domain.com"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://django-traefik.your-domain.com,https://*.your-domain.com"
      DJANGO_SECURE_SSL_REDIRECT: "1"
      DJANGO_SECURE_HSTS_SECONDS: "31536000"
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "1"
      DJANGO_SECURE_HSTS_PRELOAD: "1"
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django.rule=Host(`django-traefik.your-domain.com`)"
      - "traefik.http.routers.django.tls=true"
      - "traefik.http.routers.django.tls.certresolver=letsencrypt"
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data/
    expose:
      - 5432
    environment:
      - POSTGRES_USER=django_traefik
      - POSTGRES_PASSWORD=django_traefik
      - POSTGRES_DB=django_traefik
  traefik:
    build:
      context: .
      dockerfile: Dockerfile.traefik
    ports:
      - 80:80
      - 443:443
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik-public-certificates:/certificates"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`dashboard-django-traefik.your-domain.com`)"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=testuser:$$apr1$$jIKW.bdS$$eKXe4Lxjgy/rH65wP1iQe1"

volumes:
  postgres_data_prod:
  traefik-public-certificates:
